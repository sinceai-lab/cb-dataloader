name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - weather-aggregator/**
      - c3/**
      - data-viewer/chat-bot/**
      - .github/workflows/publish-images.yml
  pull_request:
    paths:
      - weather-aggregator/**
      - c3/**
      - data-viewer/chat-bot/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: weather-aggregator
            context: ./weather-aggregator
          - name: c3
            context: ./c3
          - name: chat-bot
            context: ./data-viewer/chat-bot
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apetit-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build, so a broken Dockerfile is caught before merge.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
