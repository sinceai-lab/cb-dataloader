name: apetit

services:
  coraine:
    image: quay.io/seamware/coraine:${CORAINE_VERSION}
    platform: linux/amd64
    hostname: coraine
    container_name: apetit-coraine
    depends_on:
      mongo-db:
        condition: service_healthy
      timescale-db:
        condition: service_healthy
      context:
        condition: service_healthy
    ports:
      - "${CORAINE_PORT}:1026"
    command:
      - --database
      - mongoc
      - --dbHost
      - mongo-db
      - --dbName
      - cor
      - --troe
      - timescale
      - --troeHost
      - timescale-db
      - --troeName
      - corh
      - --troeUser
      - coraine
      - --troePwd
      - coraine
      - --apiPlugins
      - admin
      - --distributed

  # Serves the JSON-LD @context files; Coraine fetches http://context/user-context.jsonld
  context:
    image: httpd:alpine
    hostname: context
    container_name: apetit-context
    ports:
      - "${CONTEXT_PORT}:80"
    volumes:
      - ./data-models:/usr/local/apache2/htdocs/:ro
      - ./conf/mime.types:/usr/local/apache2/conf/mime.types:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/user-context.jsonld"]
      interval: 5s
      retries: 12

  mongo-db:
    image: mongo:${MONGO_DB_VERSION}
    hostname: mongo-db
    container_name: apetit-mongo
    ports:
      - "${MONGO_DB_PORT}:27017"
    volumes:
      - mongo-db:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "localhost:27017/test", "--quiet"]
      interval: 5s
      retries: 12

  timescale-db:
    image: timescale/timescaledb-ha:pg16
    hostname: timescale-db
    container_name: apetit-timescale
    environment:
      - POSTGRES_USER=coraine
      - POSTGRES_PASSWORD=coraine
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "${TIMESCALE_PORT}:5432"
    volumes:
      - timescale-db:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coraine"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 60s

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    hostname: keycloak
    container_name: apetit-keycloak
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-keycloak/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=1234
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=1234
      - KC_HTTP_PORT=8080
      # Fixed frontend host so the token `iss` matches from the host and from inside the network.
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=${KEYCLOAK_PORT}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_BACKCHANNEL=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ./realm-config:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  postgres-keycloak:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres-keycloak
    container_name: apetit-postgres-keycloak
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 10s
      retries: 6

  apisix:
    image: apache/apisix:3.9.0-debian
    hostname: apisix
    container_name: apetit-apisix
    depends_on:
      keycloak:
        condition: service_healthy
      coraine:
        condition: service_started
    ports:
      - "${APISIX_EXPOSED_PORT}:${APISIX_PORT}"
    volumes:
      - ./apisix-config/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix-config/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    healthcheck:
      # Image has no curl/wget and dash has no /dev/tcp, so ask for bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/${APISIX_PORT} && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      retries: 12
      start_period: 10s

  weather-aggregator:
    build: ./weather-aggregator
    hostname: weather-aggregator
    container_name: apetit-weather-aggregator
    depends_on:
      coraine:
        condition: service_started
      context:
        condition: service_healthy
    ports:
      - "${WEATHER_AGGREGATOR_PORT}:${WEATHER_AGGREGATOR_PORT}"
    environment:
      - PORT=${WEATHER_AGGREGATOR_PORT}
      - CORAINE_URL=http://coraine:1026
      - CONTEXT_URL=http://context/user-context.jsonld
      - NOTIFY_URL=http://weather-aggregator:${WEATHER_AGGREGATOR_PORT}/notify
      - LOG_FILE=/app/logs/debug.log
    volumes:
      - ./weather-aggregator/logs:/app/logs

volumes:
  mongo-db:
  mongo-config:
  timescale-db:
